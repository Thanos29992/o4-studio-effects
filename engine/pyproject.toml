[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-studio-effects"
version = "0.1.0"
description = "NPU-accelerated camera effects for Linux — background blur, auto-framing"
requires-python = ">=3.11"
dependencies = [
    "openvino>=2025.0",
    "opencv-python>=4.9",
    "pyvirtualcam>=0.14",
    "numpy>=1.26",
    "Pillow>=10.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
gui = [
    "PyGObject>=3.46",
]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[project.scripts]
studio-effects = "src.main:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
