[camera]
device_index = 0
width = 1280
height = 720
fps = 30
mirror = true

[virtual_camera]
device_path = "/dev/video10"
label = "StudioEffects"

[inference]
device = "NPU"
fallback_device = "CPU"

[effects.background]
enabled = false
mode = "blur"  # "blur", "replace", "none"
blur_strength = 51
background_image = ""
# Locked tuning values (user-chosen 2026-09-26 — no bg presets, just these defaults)
matte_feather = 15  # odd kernel px for edge feather (1 = off)
matte_floor = 0.35  # alpha below this -> full background (kills edge bleed)
matte_gamma = 0.5  # >1 tightens matte (less halo), <1 fattens subject
matte_temporal = 0.1  # EMA weight of previous mask (higher = steadier, laggier)

# SLOW preset values (see config/presets/slow.toml)
[effects.auto_frame]
enabled = true
zoom_margin = 3.0
smoothing_factor = 0.075  # per-frame ease toward detected face (lower = slower glide)
detection_interval = 1.0  # seconds between face detections (NPU poll rate)
confidence_threshold = 0.85
headroom = 0.24  # empty space above head in crop (fraction of crop height)
transition_speed = 0.25  # zoom in/out fade speed
deadzone = 0.22  # center tolerance as portrait 3:4 box height (faces are vertical)
size_deadzone = 0.15  # zoom tolerance: small forward/back shifts are ignored
