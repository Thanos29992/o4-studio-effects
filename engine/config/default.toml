[camera]
device_index = 0
width = 1280
height = 720
fps = 30
mirror = true

[virtual_camera]
device_path = "/dev/video10"
label = "StudioEffects"

[inference]
device = "NPU"
fallback_device = "CPU"

[effects.background]
enabled = false
mode = "blur"  # "blur", "replace", "none"
blur_strength = 51
background_image = ""

[effects.auto_frame]
enabled = true
zoom_margin = 2.2
smoothing_factor = 0.04  # per-frame ease toward detected face (lower = slower glide)
detection_interval = 1.0  # seconds between face detections (CPU poll rate)
confidence_threshold = 0.5
headroom = 0.18  # empty space above head in crop (fraction of crop height)
transition_speed = 0.05  # zoom in/out fade speed
deadzone = 0.08  # center tolerance as portrait 3:4 box height (faces are vertical)
size_deadzone = 0.15  # zoom tolerance: small forward/back shifts are ignored
